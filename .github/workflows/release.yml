name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type == 'tag' && !github.event.deleted
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Require matching release versions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const version = manifest.version;
          if (typeof version !== 'string' ||
              !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) ||
              version !== pkg.version || version !== process.env.GITHUB_REF_NAME) {
            throw new Error('The tag must exactly match the stable X.Y.Z version in manifest.json and package.json (no v prefix).');
          }
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Stage release assets
        run: |
          mkdir release
          cp main.js manifest.json styles.css release/

      - name: Transfer exact release assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    # Keep dependency installation and build scripts out of the privileged job.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download this build's immutable assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          digest-mismatch: error

      # Existing releases are deliberately not overwritten, including on reruns.
      - name: Create draft release and upload assets
        run: |
          gh release create "$RELEASE_TAG" \
            release/main.js release/manifest.json release/styles.css \
            --verify-tag --draft --title "Pretty URL $RELEASE_TAG" --generate-notes

      - name: Attest the exact uploaded files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css

      - name: Publish only after provenance succeeds
        run: gh release edit "$RELEASE_TAG" --draft=false --verify-tag
